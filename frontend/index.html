<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Crowd Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__title">Event Crowd Monitor</span>
    <span class="topbar__session" id="session-label">Session —</span>
  </div>
  <div class="topbar__actions">
    <button class="btn btn--ghost" id="reset-btn">Reset counts</button>
    <button class="btn btn--primary" id="new-session-btn">Start new session</button>
  </div>
</header>

<main class="layout">
  <section class="summary" id="summary-bar">
    <div class="summary__tile">
      <div class="summary__label">Total crowd inside event area</div>
      <div class="summary__value" id="summary-event-total">0</div>
    </div>
    <div class="summary__tile">
      <div class="summary__label">Total crowd entered in dining</div>
      <div class="summary__value" id="summary-dining-total">0</div>
    </div>
  </section>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab-btn is-active" data-tab="overview" role="tab" aria-selected="true">Overview</button>
    <button class="tab-btn" data-tab="preview" role="tab" aria-selected="false">Preview</button>
    <button class="tab-btn" data-tab="reports" role="tab" aria-selected="false">Reports</button>
  </nav>

  <section class="tab-panel" id="tab-overview" data-tab-panel="overview">
    <section class="camera-grid camera-grid--overview" id="overview-grid">
      <!-- numbers-only camera cards injected by app.js -->
    </section>

    <section class="activity">
      <h2 class="activity__heading">Recent activity</h2>
      <ul class="activity__list" id="activity-list">
        <li class="activity__empty">No crossings recorded yet.</li>
      </ul>
    </section>
  </section>

  <section class="tab-panel" id="tab-preview" data-tab-panel="preview" hidden>
    <section class="camera-grid camera-grid--preview" id="preview-grid">
      <!-- video-only camera cards injected by app.js -->
    </section>
  </section>

  <section class="tab-panel" id="tab-reports" data-tab-panel="reports" hidden>
    <div class="reports-toolbar">
      <label class="reports-toolbar__label" for="report-interval">Window size</label>
      <select id="report-interval" class="select">
        <option value="15">15 minutes</option>
        <option value="30" selected>30 minutes</option>
        <option value="60">60 minutes</option>
      </select>
      <button class="btn btn--ghost" id="report-refresh-btn">Refresh</button>
      <span class="reports-toolbar__generated" id="report-generated"></span>
    </div>
    <div id="reports-content">
      <p class="activity__empty">Loading report…</p>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
